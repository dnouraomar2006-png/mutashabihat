<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متشابهات سورتي الزمر وغافر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf8ee;--card:#fffdf7;--rose:#d9b3a3;--acc:#b5485d;--ink:#4b4b3f;--sage:#7a7d6a;--ok:#5d8a5a;--bad:#b5485d;--line:#ecd9cf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2522;--card:#352e2a;--rose:#8c6a5c;--acc:#e58a9c;--ink:#f1e8dc;--sage:#b9bca6;--ok:#8fc48b;--bad:#e58a9c;--line:#4d423b;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Amiri','Traditional Arabic',serif;font-size:18px;line-height:1.9}
.wrap{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:28px;text-align:center;margin:6px 0 0;color:var(--sage)}
.sub{text-align:center;font-size:15px;color:var(--rose);margin-bottom:10px}
nav{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:5}
nav button{flex:1;font:inherit;font-size:16px;padding:6px 4px;border:1.5px solid var(--rose);background:var(--card);color:var(--ink);border-radius:12px;cursor:pointer}
nav button.on{background:var(--rose);color:#fff;font-weight:700}
.box{background:var(--card);border:2px solid var(--rose);border-radius:18px;padding:14px;margin:10px 0}
.grid{display:grid;gap:10px}
.sec{display:flex;justify-content:space-between;align-items:center;font:inherit;font-size:19px;width:100%;text-align:right;padding:12px 14px;border:2px solid var(--rose);background:var(--card);color:var(--ink);border-radius:16px;cursor:pointer}
.pill{font-size:14px;color:var(--acc)}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.card{min-height:230px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;text-align:center}
.card .t{font-size:26px;font-weight:700}
.hint{font-size:14px;color:var(--sage)}
.v{margin:8px 0;padding:8px 10px;border-radius:12px;background:var(--bg);border:1px solid var(--line);text-align:right;font-size:19px}
.v small{display:block;color:var(--acc);font-size:14px}
mark{background:none;color:var(--acc);font-weight:700;border-bottom:2px solid var(--acc)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.btn{font:inherit;font-size:17px;padding:8px 16px;border-radius:12px;border:1.5px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
.btn.o{background:none;color:var(--acc)}
.opt{display:block;width:100%;font:inherit;font-size:19px;text-align:right;padding:10px 12px;margin:7px 0;border:1.5px solid var(--rose);border-radius:12px;background:var(--card);color:var(--ink);cursor:pointer}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.q{font-size:22px;text-align:center;margin:6px 0 10px}
.note{font-size:16px;color:var(--sage);min-height:28px;text-align:center}
.top{display:flex;justify-content:space-between;font-size:16px;color:var(--sage)}
.big{font-size:44px;text-align:center;color:var(--acc);font-weight:700}
.hid{display:none}
</style>
</head>

<script>

const SECS=[
{n:'الزمر مع نفسها',c:[

{t:'مِن قَبْلِ أَن يَأْتِيَكُمُ الْعَذَابُ',v:[['الزمر ٥٤','مِن قَبْلِ أَن يَأْتِيَكُمُ الْعَذَابُ <mark>ثُمَّ لَا تُنصَرُونَ</mark>'],['الزمر ٥٥','مِن قَبْلِ أَن يَأْتِيَكُمُ الْعَذَابُ <mark>بَغْتَةً وَأَنتُمْ لَا تَشْعُرُونَ</mark>']]}]},
{n:'الزمر وغافر',c:[

{t:'وَمَن يُضْلِلِ اللَّهُ فَمَا لَهُ مِنْ هَادٍ',v:[['الزمر ٣٦','<mark>أَلَيْسَ اللَّهُ بِكَافٍ عَبْدَهُ</mark> وَيُخَوِّفُونَكَ بِالَّذِينَ مِن دُونِهِ وَمَن يُضْلِلِ اللَّهُ فَمَا لَهُ مِنْ هَادٍ'],['غافر ٣٣','<mark>يَوْمَ تُوَلُّونَ مُدْبِرِينَ مَا لَكُم مِّنَ اللَّهِ مِنْ عَاصِمٍ</mark> وَمَن يُضْلِلِ اللَّهُ فَمَا لَهُ مِنْ هَادٍ']]},
{t:'إِنَّ اللَّهَ لَا يَهْدِي مَنْ هُوَ',v:[['الزمر ٣','إِنَّ اللَّهَ لَا يَهْدِي مَنْ هُوَ <mark>كَاذِبٌ كَفَّارٌ</mark>'],['غافر ٢٨','إِنَّ اللَّهَ لَا يَهْدِي مَنْ هُوَ <mark>مُسْرِفٌ كَذَّابٌ</mark>']]},

{n:'غافر مع غيرها',c:[
{t:'كَانُوا أَشَدَّ مِنْهُمْ',v:[['غافر ٢١','كَانُوا <mark>هُمْ</mark> أَشَدَّ مِنْهُمْ قُوَّةً وَآثَارًا فِي الْأَرْضِ'],['غافر ٨٢','كَانُوا <mark>أَكْثَرَ مِنْهُمْ وَأَشَدَّ</mark> قُوَّةً وَآثَارًا فِي الْأَرْضِ'],['فاطر ٤٤','<mark>وَ</mark>كَانُوا أَشَدَّ مِنْهُمْ قُوَّةً']]},
{t:'ذَٰلِكَ بِأَنَّهُ / بِأَنَّهُمْ',v:[['غافر ٢٢','ذَٰلِكَ <mark>بِأَنَّهُمْ</mark> كَانَت تَّأْتِيهِمْ رُسُلُهُم بِالْبَيِّنَاتِ فَكَفَرُوا'],['التغابن ٦','ذَٰلِكَ <mark>بِأَنَّهُ</mark> كَانَت تَّأْتِيهِمْ رُسُلُهُم بِالْبَيِّنَاتِ فَقَالُوا أَبَشَرٌ يَهْدُونَنَا']]},
{t:'فَاصْبِرْ إِنَّ وَعْدَ اللَّهِ حَقٌّ',v:[['غافر ٥٥','فَاصْبِرْ إِنَّ وَعْدَ اللَّهِ حَقٌّ <mark>وَاسْتَغْفِرْ لِذَنبِكَ وَسَبِّحْ بِحَمْدِ رَبِّكَ بِالْعَشِيِّ وَالْإِبْكَارِ</mark>'],['الروم ٦٠','فَاصْبِرْ إِنَّ وَعْدَ اللَّهِ حَقٌّ <mark>وَلَا يَسْتَخِفَّنَّكَ الَّذِينَ لَا يُوقِنُونَ</mark>']]},
{t:'سُنَّةَ اللَّهِ',v:[['غافر ٨٥','<mark>سُنَّتَ</mark> اللَّهِ الَّتِي قَدْ خَلَتْ فِي عِبَادِهِ'],['الأحزاب ٦٢','<mark>سُنَّةَ</mark> اللَّهِ فِي الَّذِينَ خَلَوْا مِن قَبْلُ'],['الفتح ٢٣','<mark>سُنَّةَ</mark> اللَّهِ الَّتِي قَدْ خَلَتْ مِن قَبْلُ']]},

['«فَاصْبِرْ إِنَّ وَعْدَ اللَّهِ حَقٌّ وَلَا يَسْتَخِفَّنَّكَ …»<br>في أي سورة؟',['غافر','الروم'],1,'الروم ٦٠.',2]

const LV=['الزمر مع نفسها','الزمر وغافر','غافر مع غيرها','الكل'];
const st=JSON.parse(JSON.stringify({seen:{},best:{}}));
let tab='home',cur=null;
const $=id=>document.getElementById(id);
function nav(){ $('nav').innerHTML=[['home','الرئيسية'],['cards','بطاقات'],['quiz','اختبار']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('') }
function go(t,x){tab=t;cur=x||null;nav();({home,cards,quiz}[t])()}
function pct(i){const n=SECS[i].c.length;let s=0;SECS[i].c.forEach((c,j)=>{if(st.seen[i+'-'+j])s++});return Math.round(s/n*100)}
function home(){
 $('app').innerHTML=`<div class="box"><b>كيف تستخدمينه؟</b><br>ابدئي بالبطاقات لتري الفروق ملوّنة، ثم اختبري نفسك.</div><div class="grid">`+SECS.map((s,i)=>`<button class="sec" onclick="go('cards',${i})"><span>${s.n}</span><span class="pill">${pct(i)}٪ · ${s.c.length} بطاقات</span></button>`).join('')+`</div><div class="row"><button class="btn" onclick="go('quiz')">ابدئي الاختبار</button></div><div class="box hint">ملاحظة: راجعي النصوص مع المصحف قبل الاعتماد النهائي.</div>`}
function cards(){
 if(cur===null){cur=0}
 let i=cur,j=0;drawCard(i,j)}
function drawCard(i,j){
 const s=SECS[i],c=s.c[j];st.seen[i+'-'+j]=1;
 $('app').innerHTML=`<div class="row">`+SECS.map((x,k)=>`<button class="btn ${k===i?'':'o'}" style="font-size:14px;padding:4px 10px" onclick="drawCard(${k},0)">${x.n}</button>`).join('')+`</div>
 <div class="top"><span>${j+1} / ${s.c.length}</span><span>اضغطي على البطاقة لقلبها</span></div>
 <div class="bar"><i style="width:${(j+1)/s.c.length*100}%"></i></div>
 <div class="box card" id="cd" onclick="flip()"><div class="t" id="front">${c.t}</div><div id="back" class="hid">${c.v.map(v=>`<div class="v"><small>${v[0]}</small>${v[1]}</div>`).join('')}</div></div>
 <div class="row"><button class="btn o" ${j?'':'disabled'} onclick="drawCard(${i},${j-1})">السابقة</button><button class="btn" onclick="${j<s.c.length-1?`drawCard(${i},${j+1})`:`go('quiz')`}">${j<s.c.length-1?'التالية':'إلى الاختبار'}</button></div>`}
function flip(){$('front').classList.toggle('hid');$('back').classList.toggle('hid')}
let qs=[],qi=0,sc=0,wrong=[],timed=false,tm=null,tl=0;
function quiz(){
 clearInterval(tm);
 $('app').innerHTML=`<div class="box"><b>اختاري المستوى</b></div><div class="grid">`+LV.map((l,i)=>`<button class="sec" onclick="startQ(${i},false)"><span>${l}</span><span class="pill">${i<3?Q.filter(q=>q[4]===i).length:Q.length} سؤالًا${st.best[i]!=null?' · أفضل: '+st.best[i]:''}</span></button>`).join('')+`</div><div class="row"><button class="btn o" onclick="startQ(3,true)">تحدي الوقت (١٥ ثانية) – الكل</button></div>`}
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}
function startQ(lv,t,pool){
 timed=t;window.lv=lv;qs=shuffle(pool||(lv<3?Q.filter(q=>q[4]===lv):Q));qi=0;sc=0;wrong=[];showQ()}
function showQ(){
 clearInterval(tm);
 if(qi>=qs.length)return result();
 const q=qs[qi],order=shuffle(q[1].map((o,i)=>i));
 $('app').innerHTML=`<div class="top"><span>${qi+1} / ${qs.length}</span><span id="tt">${timed?'⏱ 15':''}</span><span>النقاط: ${sc}</span></div><div class="bar"><i style="width:${qi/qs.length*100}%"></i></div>
 <div class="box"><div class="q">${q[0]}</div><div id="os">${order.map(i=>`<button class="opt" onclick="pick(this,${i})">${q[1][i]}</button>`).join('')}</div><div class="note" id="nt"></div></div><div class="row"><button class="btn hid" id="nx" onclick="qi++;showQ()">التالي</button></div>`;
 if(timed){tl=15;tm=setInterval(()=>{tl--;$('tt').textContent='⏱ '+tl;if(tl<=0){clearInterval(tm);pick(null,-1)}},1000)}}
function pick(b,i){
 clearInterval(tm);
 const q=qs[qi],ok=i===q[2];
 document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
 const all=[...document.querySelectorAll('.opt')];
 all.forEach(x=>{if(x.textContent===q[1][q[2]])x.classList.add('ok')});
 if(b&&!ok)b.classList.add('bad');
 if(ok)sc++;else wrong.push(q);
 $('nt').textContent=(ok?'أحسنتِ! ':i<0?'انتهى الوقت. ':'')+q[3];
 $('nx').classList.remove('hid');$('nx').textContent=qi<qs.length-1?'التالي':'النتيجة'}
function result(){
 const p=Math.round(sc/qs.length*100);
 if(st.best[lv]==null||sc>st.best[lv])st.best[lv]=sc;
 $('app').innerHTML=`<div class="box"><div class="big">${sc} / ${qs.length}</div><div class="q">${p>=80?'ما شاء الله، إتقان ممتاز':p>=50?'جيد، كرري الأخطاء':'لا بأس، راجعي البطاقات وأعيدي'}</div><div class="bar"><i style="width:${p}%"></i></div></div>`+
 (wrong.length?`<div class="box"><b>أخطاؤك:</b>${wrong.map(q=>`<div class="v">${q[0]}<small>${q[3]}</small></div>`).join('')}</div>`:'')+
 `<div class="row">${wrong.length?`<button class="btn" onclick="startQ(lv,timed,wrong.slice())">أعيدي الأخطاء</button>`:''}<button class="btn o" onclick="go('quiz')">مستوى آخر</button><button class="btn o" onclick="go('cards',0)">البطاقات</button></div>`}
go('home');
</script>
